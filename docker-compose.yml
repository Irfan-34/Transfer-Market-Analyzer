version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/processed/app_database.db
      - POLL_INTERVAL_SECONDS=300
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
